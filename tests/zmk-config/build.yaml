include:
  - artifact: device_board_feature_disabled
    board: xiao_ble//zmk
    shield: tester_xiao

  - artifact: device_board_with_rpc
    board: xiao_ble//zmk
    shield: tester_xiao
    cmake-args: -DCONFIG_ZMK_STUDIO=y -DCONFIG_MCK_DEVICE=y -DCONFIG_MCK_DEVICE_STUDIO_RPC=y
    snippet: studio-rpc-usb-uart

  - artifact: device_board_without_rpc
    board: xiao_ble//zmk
    shield: tester_xiao
    cmake-args: -DCONFIG_MCK_DEVICE=y

  # MCK-01 / MCK-02 style: AAA battery driver as zmk,battery (state-of-charge
  # mode) + mck__device RPC with its battery / connection notifications.
  - artifact: mck_aaa_battery
    board: xiao_ble//zmk
    shield: tester_xiao
    cmake-args: -DCONFIG_ZMK_STUDIO=y -DCONFIG_MCK_DEVICE=y
    snippets:
      - studio-rpc-usb-uart
      - mck-aaa-battery

  # MCK Aquarium settings: battery type + idle / sleep (main+dya), deep sleep on.
  - artifact: mck_settings
    board: xiao_ble//zmk
    shield: tester_xiao
    cmake-args: -DCONFIG_ZMK_STUDIO=y -DCONFIG_MCK_DEVICE=y -DCONFIG_MCK_SETTINGS=y -DCONFIG_MCK_SETTINGS_POWER=y -DCONFIG_ZMK_SLEEP=y
    snippets:
      - studio-rpc-usb-uart
      - mck-aaa-battery

  # Settings without the power part (what a ZMK without main+dya can build).
  - artifact: mck_settings_battery_only
    board: xiao_ble//zmk
    shield: tester_xiao
    cmake-args: -DCONFIG_ZMK_STUDIO=y -DCONFIG_MCK_DEVICE=y -DCONFIG_MCK_SETTINGS=y
    snippets:
      - studio-rpc-usb-uart
      - mck-aaa-battery

  # mck__device next to another custom Studio RPC subsystem.
  - artifact: custom_settings_board
    board: xiao_ble//zmk
    shield: tester_xiao
    cmake-args: -DCONFIG_ZMK_STUDIO=y -DCONFIG_MCK_DEVICE=y -DCONFIG_MCK_DEVICE_STUDIO_RPC=y -DCONFIG_ZMK_CUSTOM_SETTINGS=y -DCONFIG_ZMK_CUSTOM_SETTINGS_STUDIO_RPC=y
    snippet: studio-rpc-usb-uart

  # IQS5xx trackpad driver (mck,iqs5xx), the GRT65W rev1 wiring. Status read in one block.
  - artifact: mck_iqs5xx
    board: xiao_ble//zmk
    shield: tester_xiao
    snippet: mck-iqs5xx

  # Same, with the original one-register-per-transaction reads.
  - artifact: mck_iqs5xx_no_block_read
    board: xiao_ble//zmk
    shield: tester_xiao
    cmake-args: -DCONFIG_MCK_IQS5XX_BLOCK_READ=n
    snippet: mck-iqs5xx

  # The taps press key positions (gesture-positions) instead of reporting buttons.
  - artifact: mck_iqs5xx_positions
    board: xiao_ble//zmk
    shield: tester_xiao
    snippets:
      - mck-iqs5xx
      - mck-iqs5xx-positions

  # Correction, acceleration, inertia and scroll only all on, with &tp_scroll and Studio.
  - artifact: mck_iqs5xx_motion
    board: xiao_ble//zmk
    shield: tester_xiao
    cmake-args: -DCONFIG_ZMK_STUDIO=y -DCONFIG_MCK_IQS5XX_CORRECTION=2 -DCONFIG_MCK_IQS5XX_ACCEL=5 -DCONFIG_MCK_IQS5XX_INERTIA_CURSOR=5 -DCONFIG_MCK_IQS5XX_INERTIA_SCROLL=5 -DCONFIG_MCK_IQS5XX_SCROLL_ONLY=y
    snippets:
      - studio-rpc-usb-uart
      - mck-iqs5xx
      - mck-iqs5xx-positions
      - mck-iqs5xx-motion

  # Touch log for tuning the 3 / 4 finger gestures, and the move log for the correction,
  # acceleration and inertia (USB logging builds).
  - artifact: mck_iqs5xx_touch_log
    board: xiao_ble//zmk
    shield: tester_xiao
    cmake-args: -DCONFIG_MCK_IQS5XX_TOUCH_LOG=y -DCONFIG_MCK_IQS5XX_MOTION_LOG=y -DCONFIG_MCK_IQS5XX_CORRECTION=2 -DCONFIG_MCK_IQS5XX_ACCEL=5 -DCONFIG_MCK_IQS5XX_INERTIA_CURSOR=5
    snippet: mck-iqs5xx
