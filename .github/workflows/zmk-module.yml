name: Test ZMK Module

on:
  push:
    branches:
      - "main"
    paths-ignore:
      - "**/*.md"
      - .gitignore
      - "LICENSE"
  pull_request:
    paths-ignore:
      - "**/*.md"
      - .gitignore
      - "LICENSE"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    container:
      image: zmkfirmware/zmk-build-arm:stable
    name: Build
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - uses: ./.github/actions/west-init
      - name: Test
        # Builds every tests/zmk-config/build.yaml artifact and runs the
        # native_sim test in tests/studio.
        run: python3 -m unittest -v
      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: zmk-firmware
          path: |
            build/*/zephyr/zmk.uf2
