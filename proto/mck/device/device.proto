syntax = "proto3";

// mck__device: model / connection / battery info for MCK Aquarium.
// Every request is empty: the firmware answers from its current state.
package mck.device;

enum Transport {
    TRANSPORT_NONE = 0;
    TRANSPORT_USB = 1;
    TRANSPORT_BLE = 2;
}

message GetInfoRequest {}

message GetInfoResponse {
    // CONFIG_MCK_DEVICE_MODEL, e.g. "MCK-02"
    string model = 1;
    // CONFIG_MCK_DEVICE_BOARD_REVISION, e.g. "rev1"
    string board_revision = 2;
    // Version of this module (zmk-module-mck)
    string module_version = 3;
    // Number of split peripherals this central talks to (0 = not split / peripheral)
    uint32 peripheral_count = 4;
    // Number of Bluetooth profiles (0 = no BLE)
    uint32 ble_profile_count = 5;
}

message GetStatusRequest {}

message Battery {
    // false: no battery sensor, or no value yet
    bool known = 1;
    uint32 percent = 2;
    // Battery voltage in mV. 0 = unknown (split peripherals only report percent)
    uint32 millivolts = 3;
}

message Status {
    // Transport currently used for HID reports
    Transport transport = 1;
    // Active Bluetooth profile (0-based)
    uint32 ble_profile_index = 2;
    bool ble_profile_connected = 3;
    bool usb_powered = 4;
    // This half (the one Studio talks to)
    Battery central_battery = 5;
    // Split peripherals, in ZMK's peripheral order
    repeated Battery peripheral_batteries = 6;
    // Whether each split peripheral is connected (judged from its battery
    // report: ZMK sets it to 0 when the peripheral disconnects)
    repeated bool peripheral_connected = 7;
}

enum BatteryType {
    BATTERY_TYPE_NIMH = 0;      // eneloop and other NiMH
    BATTERY_TYPE_ALKALINE = 1;
}

// Settings kept in flash. The central sends changes to the split peripherals.
message Settings {
    // Idle / sleep can be changed (CONFIG_MCK_SETTINGS_POWER, ZMK main+dya)
    bool power_supported = 1;
    // Milliseconds of inactivity before idle (0 = never)
    uint32 idle_ms = 2;
    // Milliseconds of inactivity before deep sleep (0 = never)
    uint32 sleep_ms = 3;
    // The battery type can be changed (CONFIG_MCK_SETTINGS + mck,aaa-battery)
    bool battery_type_supported = 4;
    BatteryType battery_type = 5;
}

message GetSettingsRequest {}

// Applies the supported parts of `settings` (the *_supported fields are ignored)
message SetSettingsRequest { Settings settings = 1; }

message Request {
    oneof request_type {
        GetInfoRequest get_info = 1;
        GetStatusRequest get_status = 2;
        GetSettingsRequest get_settings = 3;
        SetSettingsRequest set_settings = 4;
    }
}

message ErrorResponse { string message = 1; }

message Response {
    oneof response_type {
        ErrorResponse error = 1;
        GetInfoResponse get_info = 2;
        Status get_status = 3;
        // Answer to both GetSettings and SetSettings (the values now in effect)
        Settings settings = 4;
    }
}

// Sent as a CustomNotification payload when the battery or the connection changes.
message Notification {
    oneof notification_type { Status status_changed = 1; }
}
