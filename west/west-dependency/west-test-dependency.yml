# List of this module's dependencies for testing
manifest:
  remotes:
    - name: zmkfirmware
      url-base: https://github.com/zmkfirmware
    - name: cormoran
      url-base: https://github.com/cormoran
  projects:
    # ZMK with the custom Studio RPC protocol (cormoran's fork,
    # main+custom-studio-protocol). Same revision as MCK-02's firmware.
    # MCK-01 uses the v0.3 variant (b227a48); its keyboard build covers that one.
    - name: zmk
      remote: cormoran
      revision: 1fc72aaff7a42bd533c1f4c9b3f23c5317c745f4
      import:
        file: app/west.yml
      clone-depth: 1
    # Provides the `west zmk-build` / `west zmk-test` commands used by test.py.
    - name: zmk-west-commands
      remote: cormoran
      revision: main
      import: true
    # Only for the custom_settings_board build test and tests/studio
    # (mck__device next to another custom RPC subsystem).
    - name: zmk-feature-custom-settings
      remote: cormoran
      revision: main
